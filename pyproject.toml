[project]
name = "rover"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "authlib>=1.8.0",
    "croniter>=6.2.4",
    "docker>=7.2.0",
    "falcon>=4.3.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "testcontainers>=4.15.0",
    "tomlkit>=0.15.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "platformdirs>=4.11.5",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "types-croniter>=6.2.4.20260711",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["I", "F", "S"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["rover"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S608", "S110", "S108", "S105"]
"**/shipship/**" = ["S101", "S608"]
"**/cli/**" = ["S310"]
"**/bin/setup-openbao.py" = ["S603", "S607", "S108"]



[tool.poe]
executor = { type = "uv" }

[tool.poe.tasks]
test = { cmd = "pytest tests/", help = "Run all tests" }

coverage = { cmd = "pytest --cov=src --cov-report=term-missing tests/", help = "Run tests with coverage" }
lint = { cmd = "ruff check --fix .", help = "Lint code using ruff" }
format = { cmd = "ruff format .", help = "Format code using ruff" }
vulture = { cmd = "vulture src/", help = "Find dead code" }
mypy = { cmd = "mypy src/", help = "Run mypy" }
clean = { cmd = "python -c \"import shutil, glob; [shutil.rmtree(p, ignore_errors=True) for p in ['.pytest_cache', '.mypy_cache', '.ruff_cache', '.coverage', 'htmlcov', 'dist', 'build'] + glob.glob('**/__pycache__', recursive=True)]\"", help = "Clean test cache, coverage, and temporary build artifacts" }
verify = { sequence = ["lint", "format", "vulture", "test", "mypy"], help = "Run lint, format, vulture, test, and mypy in sequence" }
up = { cmd = "docker compose -f docker/docker-compose.yml -p rover up -d --build", help = "Start the compose stack in Docker" }
dev = { sequence = [{ cmd = "bin/dev-setup.sh" }, { cmd = "docker compose --env-file .env.dev -f docker/docker-compose.yml -f docker/docker-compose.dev.yml -p rover up -d --build" }], help = "Start the compose stack with Mailpit & WebhookHub dev mix-in" }
dev-down = { cmd = "docker compose --env-file .env.dev -f docker/docker-compose.yml -f docker/docker-compose.dev.yml -p rover down", help = "Stop the development compose stack including Mailpit & WebhookHub" }
down = { cmd = "docker compose -f docker/docker-compose.yml -p rover down", help = "Stop the compose stack in Docker" }
reset = { cmd = "docker compose --env-file .env.dev -f docker/docker-compose.yml -f docker/docker-compose.dev.yml -p rover down -v --remove-orphans", help = "Stop containers and purge persistent database volumes for a clean slate reset" }
db-migrate = { cmd = "python -m rover.shipship apply ./migrations", help = "Apply database migrations via Shipship" }
restart = { cmd = "docker compose -f docker/docker-compose.yml -p rover restart", help = "Restart the compose stack in Docker" }
status = { sequence = [{ cmd = "docker compose -f docker/docker-compose.yml -p rover ps -a" }, { cmd = "docker compose -f docker/docker-compose.yml -p rover top" }], help = "Display container status and active processes for the ROVER compose stack" }
logs = { cmd = "docker compose -f docker/docker-compose.yml -p rover logs -f", help = "Tail container logs from the ROVER compose stack" }
setup = { cmd = "bin/setup.sh", help = "Run first-time provisioning setup (certs, secrets, OpenBao)" }
promote-admin = { cmd = "bin/create-admin.sh", help = "Promote a user (by email or sub UUID) to system_admin role" }
delete-user = { cmd = "bin/delete-user.sh", help = "Completely remove a user from Authelia and ROVER database" }
docs-build = { sequence = [{ cmd = "bin/dev-setup.sh" }, { cmd = "docker run --rm -v ${PWD}/docs/starlight:/app -w /app node:24-alpine sh -c \"npm ci && npm run build\"" }], help = "Build Astro Starlight documentation site inside Docker (no local Node/npm required)" }
docs-dev = { cmd = "docker run --rm -it -p 4321:4321 -v ${PWD}/docs/starlight:/app -w /app node:24-alpine sh -c \"npm ci && npm run dev -- --host 0.0.0.0\"", help = "Start Astro Starlight documentation dev server inside Docker (no local Node/npm required)" }


[tool.pytest.ini_options]
testpaths = ["tests"]


[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.vulture]
exclude = ["tests/", ".venv/"]
paths = ["."]
min_confidence = 80
sort_by_size = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["tests", "src/rover/shipship"]

