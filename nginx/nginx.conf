events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Use Docker's embedded DNS server (127.0.0.11) with 5s cache TTL
    # Prevents 502 Bad Gateway when containers are restarted/recreated with new IPs
    resolver 127.0.0.11 valid=5s;

    # Server block for rover.local
    server {
        listen 80;
        server_name rover.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name rover.local;

        ssl_certificate /etc/nginx/certs/rover.local.crt;
        ssl_certificate_key /etc/nginx/certs/rover.local.key;

        location / {
            set $target_web http://web:8000;
            proxy_pass $target_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server block for auth.rover.local
    server {
        listen 80;
        server_name auth.rover.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name auth.rover.local;

        ssl_certificate /etc/nginx/certs/rover.local.crt;
        ssl_certificate_key /etc/nginx/certs/rover.local.key;

        location /authelia-custom/ {
            alias /etc/nginx/authelia-custom/;
        }

        location / {
            set $target_authelia http://authelia:9091;
            proxy_pass $target_authelia;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Inject custom CSS
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/html;
            sub_filter '</head>' '<link rel="stylesheet" href="/authelia-custom/custom.css"></head>';
            sub_filter_once on;
        }
    }

    # Server block for mail.rover.local (Mailpit Dev Service)
    server {
        listen 80;
        server_name mail.rover.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name mail.rover.local;

        ssl_certificate /etc/nginx/certs/rover.local.crt;
        ssl_certificate_key /etc/nginx/certs/rover.local.key;

        error_page 502 504 = @dev_disabled_mail;

        location / {
            set $target_mailpit http://mailpit:8025;
            proxy_pass $target_mailpit;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location @dev_disabled_mail {
            default_type text/html;
            return 503 '<!DOCTYPE html><html><head><title>ROVER Dev Service Offline</title><style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}article{background:#161b22;border:1px solid #30363d;padding:2rem;border-radius:8px;max-width:500px;text-align:center;}h1{color:#f0883e;margin-top:0;}code{background:#21262d;padding:0.2rem 0.4rem;border-radius:4px;color:#58a6ff;}</style></head><body><article><h1>Mailpit Dev Service Offline</h1><p>The Mailpit SMTP dev service is currently disabled.</p><p>To enable the dev testing stack (Mailpit & WebhookHub), launch ROVER using:</p><p><code>poe dev</code></p></article></body></html>';
        }
    }

    # Server block for hooks.rover.local (WebhookHub Dev Service)
    server {
        listen 80;
        server_name hooks.rover.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name hooks.rover.local;

        ssl_certificate /etc/nginx/certs/rover.local.crt;
        ssl_certificate_key /etc/nginx/certs/rover.local.key;

        error_page 502 504 = @dev_disabled_hooks;

        location / {
            set $target_webhookhub http://webhookhub:8080;
            proxy_pass $target_webhookhub;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location @dev_disabled_hooks {
            default_type text/html;
            return 503 '<!DOCTYPE html><html><head><title>ROVER Dev Service Offline</title><style>body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}article{background:#161b22;border:1px solid #30363d;padding:2rem;border-radius:8px;max-width:500px;text-align:center;}h1{color:#f0883e;margin-top:0;}code{background:#21262d;padding:0.2rem 0.4rem;border-radius:4px;color:#58a6ff;}</style></head><body><article><h1>WebhookHub Dev Service Offline</h1><p>The WebhookHub dev service is currently disabled.</p><p>To enable the dev testing stack (Mailpit & WebhookHub), launch ROVER using:</p><p><code>poe dev</code></p></article></body></html>';
        }
    }
}
