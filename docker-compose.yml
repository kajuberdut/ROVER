services:
  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rover
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rover_password}
      POSTGRES_DB: rover
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rover -d rover"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"

  web:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      # Grant access to /var/run/docker.sock. Run `stat -c %g /var/run/docker.sock`
      # on the host to find the correct GID, then set DOCKER_GID in .env.local if needed.
      - "${DOCKER_GID:-962}"
    environment:
      - DATABASE_URL=postgresql+psycopg://rover:${POSTGRES_PASSWORD:-rover_password}@db:5432/rover
    env_file:
      - path: .env.local
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src:/app/src
      - ./config.toml:/app/config.toml

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./authelia:/config
    restart: unless-stopped
    expose:
      - "9091"

  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/authelia-custom:/etc/nginx/authelia-custom:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - authelia
    restart: unless-stopped

volumes:
  db_data:
